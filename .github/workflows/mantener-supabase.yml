# Supabase (plan gratis) pausa el proyecto si pasa una semana sin actividad.
# Esta tarea consulta la base cada 2 días para que eso no pase.
# Se puede correr a mano desde GitHub → Actions → "Mantener Supabase activo" → Run workflow.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          # Datos públicos (los mismos de assets/js/config.js)
          SUPABASE_URL: https://lkhnmghcylqngdnsdylr.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxraG5tZ2hjeWxxbmdkbnNkeWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzgyMTcsImV4cCI6MjEwNTc1NDIxN30.j2_Bz2sdzAvntNWRfa277iiklnUye_rlCYgWxYrsLAM
        run: |
          codigo=$(curl -s -o respuesta.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/perfumes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondió $codigo"
          cat respuesta.json; echo
          test "$codigo" = "200"
